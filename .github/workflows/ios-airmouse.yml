name: iOS 空中滑鼠 App

# 每次修改 iOS 程式就在雲端 Mac 編譯一次；
# 設定好 Apple 帳號的 Secrets 後，會自動簽名並上傳到 TestFlight。
on:
  push:
    paths:
      - "air-mouse/ios/**"
      - ".github/workflows/ios-airmouse.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: air-mouse/ios
    env:
      HAS_SIGNING: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APP_BUNDLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 XcodeGen 並產生 Xcode 專案
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: 編譯檢查（不簽名）
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild -project AirMouse.xcodeproj -scheme AirMouse -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          echo "✅ 編譯成功。設定 Apple 帳號 Secrets 後會自動上傳到 TestFlight。" >> "$GITHUB_STEP_SUMMARY"

      - name: 準備 App Store Connect API 金鑰
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: 封存並簽名
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          xcodebuild -project AirMouse.xcodeproj -scheme AirMouse -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -archivePath "$RUNNER_TEMP/AirMouse.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: 上傳到 TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AirMouse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "✅ 已上傳到 TestFlight（版本號 ${{ github.run_number }}）。約 5～30 分鐘後會出現在 iPhone 的 TestFlight App。" >> "$GITHUB_STEP_SUMMARY"

      - name: 清除金鑰
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
